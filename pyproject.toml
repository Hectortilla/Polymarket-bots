[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-polybot"
version = "0.1.0"
description = "Standalone custom Polymarket bot framework."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.0",
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "python-dotenv>=1.1,<2.0",
    "asciichartpy==1.5.25",
    "polymarket-client==0.1.0b17",
    "pydantic==2.13.4",
    "rich==15.0.0",
    "SQLAlchemy[asyncio]==2.0.51",
    "sqlmodel==0.0.39",
    "redis==5.2.1",
    "taskiq==0.11.20",
    "taskiq-redis==1.0.5",
    "uvicorn==0.52.1",
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
]

[tool.setuptools]
packages = [
  "polybot.recording.trim_recovery",
  "polybot.recording.trim_export",
  "polybot.recording.trim_validation",
  "polybot.polymarket.normalization.recording_events",
  "polybot.polymarket.wallet_activity.normalization",
  "polybot.recording.trim_bootstrap",
  "polybot.recording.trim_planning",
  "polybot.backtesting.selection",
  "polybot.recording.archive.writer",
  "api.events.contracts.payloads",
  "api.catalog.graphs.catalog",
  "api.catalog.graphs.contracts",
  "polybot",
  "polybot.examples",
  "polybot.execution",
  "polybot.execution.paper",
  "polybot.framework",
  "polybot.framework.config",
  "polybot.framework.events",
  "polybot.framework.runner",
  "polybot.cli",
  "polybot.cli.dashboard",
  "polybot.cli.followed_wallets",
  "polybot.cli.streams",
  "polybot.cli.tracking",
  "polybot.cli.observability",
  "polybot.cli.performance_chart",
  "polybot.cli.resolution",
  "polybot.cli.runner",
  "polybot.dashboard",
  "polybot.polymarket",
  "polybot.polymarket.public_data",
  "polybot.polymarket.wallet_activity",
  "polybot.polymarket.normalization",
  "polybot.polymarket.recording_feed",
  "polybot.polymarket.recording_metadata",
  "polybot.polymarket.positions",
  "polybot.backtesting",
  "polybot.backtesting.state",
  "polybot.backtesting.scheduler",
  "polybot.backtesting.service",
  "polybot.performance",
  "polybot.performance.artifacts",
  "polybot.performance.contracts",
  "polybot.performance.contracts.summary",
  "polybot.persistence",
  "polybot.recording",
  "polybot.recording.archive",
  "polybot.recording.contracts",
  "polybot.recording.coordinator",
  "polybot.recording.serialization",
  "polybot.recording.service",
  "polybot.runtime",
  "polybot.runtime.performance",
  "api",
  "api.limits",
  "api.limits.redis",
  "api.deployment",
  "api.auth",
  "api.auth.store",
  "api.auth.middleware",
  "api.http.sse",
  "api.http",
  "api.http.middleware",
  "api.http.routes",
  "api.http.routes.bots",
  "api.bots",
  "api.catalog",
  "api.catalog.graphs",
  "api.catalog.node_based",
  "api.catalog.node_based.evaluator",
  "api.graph_templates",
  "api.runs",
  "api.events",
  "api.events.contracts",
  "api.execution",
  "api.execution.recovery",
  "api.execution.worker",
  "scripts",
  "scripts.select_wallet_for_analysis",
  "scripts.polymarket_wallet_api",
  "scripts.wallets_finder",
  "scripts.wallet_analysis",
]

[tool.setuptools.package-dir]
"" = "backend/src"
scripts = "scripts"
"scripts.select_wallet_for_analysis" = "scripts/select_wallet_for_analysis"
"scripts.polymarket_wallet_api" = "scripts/polymarket_wallet_api"
"scripts.wallets_finder" = "scripts/wallets_finder"
"scripts.wallet_analysis" = "scripts/wallet_analysis"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests"]
markers = [
  "postgres: requires POLYBOT_TEST_POSTGRES_URL for an isolated PostgreSQL database",
]
