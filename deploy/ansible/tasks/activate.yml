- ansible.builtin.import_tasks: validate.yml
- ansible.builtin.import_tasks: verify-ingress.yml
  vars:
    ingress_runtime_filename: '{{ deployment_contract.paths.runtime }}'
- name: Validate release identity and operation before staging
  ansible.builtin.command:
    argv: [uv, run, --locked, python, -m, scripts.deployment.controller, release]
    stdin: '{{ {"release_tag": release_tag, "release_commit": release_commit, "operation": operation} | to_json }}'
  delegate_to: localhost
  become: false
  changed_when: false
- name: Inspect existing activation before staging anything
  ansible.builtin.command: systemctl show {{ deployment_contract.service_units.activation }} --property=ActiveState --value
  register: activation_state
  changed_when: false
- name: Wait for a detached activation to finish
  ansible.builtin.command: systemctl show {{ deployment_contract.service_units.activation }} --property=ActiveState --value
  register: activation_wait
  until: activation_wait.stdout not in ['activating', 'deactivating']
  retries: '{{ deployment_contract.activation_poll_retries }}'
  delay: '{{ deployment_contract.activation_poll_interval }}'
  changed_when: false
  when: activation_state.stdout in ['activating', 'deactivating']
- name: Inspect previous activation journal
  ansible.builtin.command: journalctl -u {{ deployment_contract.service_units.activation }} -n 30 --no-pager
  register: previous_activation_journal
  changed_when: false
  no_log: true
- name: Verify bundle on the controller before extraction
  ansible.builtin.command:
    argv: [uv, run, --locked, python, -m, scripts.deployment.bundle, verify, '{{ release_bundle }}', --commit, '{{ release_commit }}', --tag, '{{ release_tag }}']
  delegate_to: localhost
  become: false
  changed_when: false
- name: Create immutable bundle directory
  ansible.builtin.file:
    path: '{{ polybot_root }}/{{ deployment_contract.paths.releases }}/{{ release_tag }}'
    state: directory
    owner: polybot
    group: polybot
    mode: '0700'
- name: Check retained bundle checksum
  ansible.builtin.stat:
    path: '{{ polybot_root }}/{{ deployment_contract.paths.releases }}/{{ release_tag }}/{{ deployment_contract.paths.bundle }}'
    checksum_algorithm: '{{ deployment_contract.checksum_algorithm }}'
  register: retained_bundle
- name: Calculate controller bundle checksum
  ansible.builtin.stat:
    path: '{{ release_bundle }}'
    checksum_algorithm: '{{ deployment_contract.checksum_algorithm }}'
  delegate_to: localhost
  become: false
  register: selected_bundle
- name: Reject a conflicting installed release
  ansible.builtin.assert:
    that: not retained_bundle.stat.exists or retained_bundle.stat.checksum == selected_bundle.stat.checksum
- name: Transfer the non-secret release bundle
  ansible.builtin.copy:
    src: '{{ release_bundle }}'
    dest: '{{ polybot_root }}/{{ deployment_contract.paths.releases }}/{{ release_tag }}/{{ deployment_contract.paths.bundle }}'
    owner: polybot
    group: polybot
    mode: '0600'
- name: Extract verified release content
  become_user: polybot
  ansible.builtin.unarchive:
    src: '{{ polybot_root }}/{{ deployment_contract.paths.releases }}/{{ release_tag }}/{{ deployment_contract.paths.bundle }}'
    dest: '{{ polybot_root }}/{{ deployment_contract.paths.releases }}/{{ release_tag }}'
    remote_src: true
    owner: polybot
    group: polybot
- name: Install locked release environment before interrupting applications
  ansible.builtin.command:
    argv: [/usr/local/bin/uv, sync, --locked, --no-dev, --python, '3.12']
    chdir: '{{ polybot_root }}/{{ deployment_contract.paths.releases }}/{{ release_tag }}'
  become_user: polybot
  changed_when: false
- name: Prepare temporary registry authentication directory
  ansible.builtin.file:
    path: '{{ polybot_root }}/{{ deployment_contract.paths.registry }}'
    state: directory
    owner: polybot
    group: polybot
    mode: '0700'
- name: Authenticate image pulls using workflow credential on stdin
  ansible.builtin.command:
    argv: [docker, --config, '{{ polybot_root }}/{{ deployment_contract.paths.registry }}', login, ghcr.io, --username, '{{ registry_username }}', --password-stdin]
    stdin: '{{ registry_token }}'
  become_user: polybot
  no_log: true
- name: Install activation unit with selected immutable inputs
  ansible.builtin.template:
    src: activate.service.j2
    dest: /etc/systemd/system/{{ deployment_contract.service_units.activation }}
    mode: '0644'
- ansible.builtin.import_tasks: close-tunnel.yml
- name: Start activation independently of SSH lifetime
  ansible.builtin.systemd_service:
    name: '{{ deployment_contract.service_units.activation }}'
    state: started
    daemon_reload: true
    no_block: true
- name: Observe activation completion
  ansible.builtin.command: systemctl show {{ deployment_contract.service_units.activation }} --property=ActiveState --value
  register: completion
  until: completion.stdout not in ['activating', 'deactivating']
  retries: '{{ deployment_contract.activation_poll_retries }}'
  delay: '{{ deployment_contract.activation_poll_interval }}'
  changed_when: false
- name: Read activation outcome
  ansible.builtin.command: systemctl show {{ deployment_contract.service_units.activation }} --property=Result --value
  register: activation_result
  changed_when: false
- name: Require successful activation
  ansible.builtin.assert:
    that: activation_result.stdout == 'success'
    fail_msg: 'Activation failed. Inspect journalctl -u polybot-activate on the host; retry the retained operation or select a forward repair.'
- ansible.builtin.import_tasks: verify-ingress.yml
  vars:
    ingress_runtime_filename: '{{ deployment_contract.paths.active_manifest }}'
- name: Activate and verify the selected ingress
  block:
    - name: Open public tunnel only after successful local release activation
      ansible.builtin.systemd_service:
        name: '{{ deployment_contract.service_units.cloudflare }}'
        enabled: true
        state: started
      when: polybot_public_enabled
    - name: Verify HTTPS readiness through the selected ingress
      ansible.builtin.uri:
        url: '{{ polybot_readiness_origin }}{{ deployment_contract.health_path }}'
        status_code: '{{ deployment_contract.health_status }}'
        validate_certs: true
        timeout: '{{ deployment_contract.https_probe_timeout }}'
      delegate_to: localhost
      become: false
      register: ingress_readiness
      until: ingress_readiness is succeeded
      retries: 12
      delay: 5
  rescue:
    - ansible.builtin.import_tasks: close-tunnel.yml
    - ansible.builtin.fail:
        msg: 'HTTPS readiness failed; the public connector is closed. Check DNS, tunnel routing and certificates, then retry deployment.'
