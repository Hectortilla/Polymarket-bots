- name: Validate the single private Debian host before mutation
  ansible.builtin.command:
    argv: [uv, run, --locked, python, -m, scripts.deployment.controller, inventory]
    stdin: '{{ {"variables": dict(deployment_variable_names | zip(query("ansible.builtin.vars", *deployment_variable_names))), "host_count": groups["polybot"] | length, "host_distribution": ansible_distribution, "host_architecture": ansible_architecture} | to_json }}'
  vars:
    deployment_variable_names: '{{ query("ansible.builtin.varnames", "^polybot_") }}'
  delegate_to: localhost
  become: false
  changed_when: false
  register: deployment_contract_result
  no_log: true
- name: Load validated deployment policy
  ansible.builtin.set_fact:
    deployment_contract: '{{ (deployment_contract_result.stdout | from_json).contract }}'
- name: Use normalized inventory values at the template boundary
  ansible.builtin.set_fact:
    '{{ item.key }}': '{{ item.value }}'
  loop: '{{ (deployment_contract_result.stdout | from_json).variables | dict2items }}'
  loop_control:
    label: '{{ item.key }}'
