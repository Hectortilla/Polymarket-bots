- name: Require the optional administrator to exist
  ansible.builtin.getent:
    database: passwd
    key: '{{ polybot_admin_user }}'
  when: polybot_admin_user is not none
- name: Require a non-root administrator UID
  ansible.builtin.assert:
    that: ansible_facts.getent_passwd[polybot_admin_user][1] | int != 0
  when: polybot_admin_user is not none
- name: Grant the optional administrator sudo-group membership
  ansible.builtin.user:
    name: '{{ polybot_admin_user }}'
    groups: sudo
    append: true
  when: polybot_admin_user is not none
- name: Validate sudo configuration
  ansible.builtin.command: /usr/sbin/visudo -c
  changed_when: false
- name: Manage optional swap
  ansible.builtin.include_tasks: swap.yml
  when: polybot_manage_swap
- name: Create the logind drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    mode: '0755'
  when: polybot_ignore_lid
- name: Keep a laptop awake when its lid closes
  ansible.builtin.copy:
    content: |
      [Login]
      HandleLidSwitch=ignore
      HandleLidSwitchExternalPower=ignore
      HandleLidSwitchDocked=ignore
    dest: /etc/systemd/logind.conf.d/99-server-lid.conf
    mode: '0644'
  when: polybot_ignore_lid
  notify: Restart logind
- name: Remove the managed lid override when opted out
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d/99-server-lid.conf
    state: absent
  when: not polybot_ignore_lid
  notify: Restart logind
- name: Enable periodic package updates
  ansible.builtin.copy:
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: '0644'
- name: Enable automatic update timers and service
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    state: started
    enabled: true
  loop: [apt-daily.timer, apt-daily-upgrade.timer, unattended-upgrades.service]
