- name: Run and verify an off-server backup
  hosts: polybot
  become: true
  tasks:
    - ansible.builtin.import_tasks: tasks/validate.yml
    - name: Require enabled backups before starting a snapshot
      ansible.builtin.assert:
        that: polybot_backups_enabled
        fail_msg: Backups are disabled. Enable polybot_backups_enabled and rerun bootstrap first.
    - name: Execute supervised backup
      ansible.builtin.systemd_service:
        name: '{{ deployment_contract.service_units.backup }}'
        state: started
