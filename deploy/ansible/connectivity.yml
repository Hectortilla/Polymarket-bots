- name: Independent connectivity observation
  hosts: polybot
  gather_facts: true
  tasks:
    - ansible.builtin.import_tasks: tasks/validate.yml
    - name: Verify ordinary OpenSSH execution
      ansible.builtin.ping:
    - name: Verify HTTPS readiness through the selected ingress
      ansible.builtin.uri:
        url: '{{ polybot_readiness_origin }}{{ deployment_contract.health_path }}'
        validate_certs: true
        timeout: '{{ deployment_contract.https_probe_timeout }}'
        status_code: '{{ deployment_contract.health_status }}'
      delegate_to: localhost
