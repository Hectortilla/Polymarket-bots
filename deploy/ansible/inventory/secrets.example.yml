# Encrypt a private copy with ansible-vault; never commit real credentials.
polybot_ssh_public_key: 'ssh-ed25519 REPLACE deployment-client'
polybot_tailscale_authkey: 'REPLACE_WITH_ONE_TIME_TAGGED_HOST_KEY'
polybot_smtp_username: REPLACE
polybot_smtp_password: REPLACE
# Required only when polybot_backups_enabled is true. Uncomment and replace then.
# polybot_sftp_private_key: |
#   REPLACE_WITH_PRIVATE_KEY
# polybot_sftp_known_hosts: |
#   REPLACE_WITH_VERIFIED_STORAGE_HOST_KEY
# polybot_age_recipients: |
#   age1REPLACE_WITH_OFFLINE_PUBLIC_RECIPIENT
# Registry credentials are temporary during CI deploy; bootstrap needs none.
