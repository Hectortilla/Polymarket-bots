all:
  children:
    polybot:
      hosts:
        beta:
          ansible_host: hec-server.tail0746d7.ts.net
          ansible_user: polybot
          ansible_ssh_common_args: '-o UserKnownHostsFile=./known_hosts -o StrictHostKeyChecking=yes'
      vars:
        polybot_ssh_public_key: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOvwSj47zq6bvmVzEqZ3Ssm8v9ATxDWGhcuOBKTR9PtR attosoria@hotmail.com'
        polybot_root: /srv/polybot
        polybot_arch: amd64 # amd64 or arm64
        polybot_origin: https://hec-server.tail0746d7.ts.net
        polybot_http_port: 8081
        polybot_smtp_host: mail.privateemail.com
        polybot_smtp_port: 587
        polybot_smtp_security: starttls
        polybot_smtp_from: accounts@polybotlab.com
        polybot_smtp_username: accounts@polybotlab.com
        polybot_alert_to: operator@polybotlab.com
