- name: Prepare one private Debian host
  hosts: polybot
  become: true
  tasks:
    - ansible.builtin.import_tasks: tasks/validate.yml
    - name: Validate private bootstrap credentials before host mutation
      ansible.builtin.command:
        argv: [uv, run, --locked, python, -m, scripts.deployment.controller, bootstrap]
        stdin: '{{ {"variables": vars | dict2items | selectattr("key", "match", "^polybot_") | items2dict, "secrets": {"ssh_public_key": polybot_ssh_public_key | default(""), "sftp_private_key": polybot_sftp_private_key | default(""), "sftp_known_hosts": polybot_sftp_known_hosts | default(""), "age_recipients": polybot_age_recipients | default(""), "smtp_username": polybot_smtp_username | default(""), "smtp_password": polybot_smtp_password | default(""), "tailscale_authkey": polybot_tailscale_authkey | default(""), "enroll_tailnet": "tailnet" not in ansible_skip_tags}} | to_json }}'
      delegate_to: localhost
      become: false
      changed_when: false
      no_log: true
    - name: Remove the obsolete bootstrap Tailscale repository entry before using apt
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list.d/pkgs_tailscale_com_stable_debian.list
        line: 'deb [signed-by=/etc/apt/keyrings/tailscale.gpg] https://pkgs.tailscale.com/stable/debian {{ ansible_distribution_release }} main'
        state: absent
        backup: true
    - name: Install distribution tools
      ansible.builtin.apt:
        name: "{{ ['ca-certificates', 'curl', 'gpg', 'python3', 'python3-debian', 'msmtp-mta', 'openssh-server'] + (['age', 'rclone'] if polybot_backups_enabled else []) }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Create apt key directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        mode: '0755'
      loop: [/etc/apt/keyrings, /usr/share/keyrings]
    - name: Install vendor signing keys
      ansible.builtin.get_url:
        url: '{{ item.url }}'
        dest: '{{ item.dest }}'
        mode: '0644'
      loop:
        - {url: 'https://download.docker.com/linux/debian/gpg', dest: /etc/apt/keyrings/docker.asc}
        - {url: 'https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg', dest: /usr/share/keyrings/tailscale-archive-keyring.gpg}
    - name: Configure signed vendor package repositories
      ansible.builtin.apt_repository:
        repo: '{{ item.repo }}'
        filename: '{{ item.filename }}'
        state: present
      loop:
        - filename: docker
          repo: 'deb [arch={{ polybot_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable'
        - filename: tailscale
          repo: 'deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian {{ ansible_distribution_release }} main'
    - name: Install Docker Engine, Compose and Tailscale
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin, tailscale]
        state: present
    - name: Install pinned uv from official distribution
      ansible.builtin.unarchive:
        src: 'https://github.com/astral-sh/uv/releases/download/{{ deployment_contract.uv_version }}/uv-{{ deployment_contract.architecture_names[polybot_arch] }}-unknown-linux-gnu.tar.gz'
        dest: /usr/local/bin
        remote_src: true
        extra_opts: [--strip-components=1]
        creates: /usr/local/bin/uv
    - name: Create service account
      ansible.builtin.user:
        name: polybot
        groups: docker
        append: true
        shell: /bin/bash
        create_home: true
    - name: Create private deployment directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: polybot
        group: polybot
        mode: '0700'
      loop:
        - '{{ polybot_root }}'
        - '{{ polybot_root }}/{{ deployment_contract.paths.secrets }}'
        - '{{ polybot_root }}/{{ deployment_contract.paths.releases }}'
        - '{{ polybot_root }}/{{ deployment_contract.paths.staging }}'
        - /home/polybot/.ssh
    - name: Install deployment SSH key
      ansible.builtin.copy:
        content: "{{ polybot_ssh_public_key | trim }}\n"
        dest: /home/polybot/.ssh/authorized_keys
        owner: polybot
        group: polybot
        mode: '0600'
    - name: Allow deployment account to manage this host
      ansible.builtin.copy:
        content: 'polybot ALL=(root) NOPASSWD: ALL'
        dest: /etc/sudoers.d/polybot
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'
    - name: Generate database password exactly once
      ansible.builtin.shell:
        cmd: 'umask 077; head -c 32 /dev/urandom | od -An -tx1 | tr -d " \n" > {{ polybot_root }}/{{ deployment_contract.paths.secrets }}/{{ deployment_contract.secret_files.postgres_password }}'
        creates: '{{ polybot_root }}/{{ deployment_contract.paths.secrets }}/{{ deployment_contract.secret_files.postgres_password }}'
      no_log: true
    - name: Read retained database credential
      ansible.builtin.slurp:
        src: '{{ polybot_root }}/{{ deployment_contract.paths.secrets }}/{{ deployment_contract.secret_files.postgres_password }}'
      register: database_password_result
      no_log: true
    - name: Validate retained credential and render runtime secrets at the controller boundary
      ansible.builtin.command:
        argv: [uv, run, --locked, python, -m, scripts.deployment.controller, secrets]
        stdin: '{{ {"database_password": database_password_result.content | b64decode, "smtp_username": polybot_smtp_username, "smtp_password": polybot_smtp_password} | to_json }}'
      delegate_to: localhost
      become: false
      changed_when: false
      register: container_secrets_result
      no_log: true
    - name: Install container runtime secrets
      ansible.builtin.copy:
        content: '{{ item.content }}'
        dest: '{{ polybot_root }}/{{ deployment_contract.paths.secrets }}/{{ item.name }}'
        owner: polybot
        group: polybot
        mode: '0444'
      loop: '{{ container_secrets_result.stdout | from_json }}'
      no_log: true
    - name: Install operational systemd units
      ansible.builtin.template:
        src: '{{ item }}'
        dest: '/etc/systemd/system/{{ item | basename | regex_replace(".j2$", "") }}'
        mode: '0644'
      with_fileglob: ['templates/polybot-*.j2']
      register: unit_installation_result
    - name: Stop and disable opted-out backup schedules
      ansible.builtin.systemd_service:
        name: '{{ item }}'
        enabled: false
        state: stopped
        daemon_reload: '{{ unit_installation_result.changed }}'
      loop: '{{ deployment_contract.backup_timers }}'
      when: not polybot_backups_enabled
    - name: Stop opted-out backup services before updating configuration
      ansible.builtin.systemd_service:
        name: '{{ item }}'
        state: stopped
      loop: '{{ deployment_contract.backup_services }}'
      when: not polybot_backups_enabled
    - name: Install private backup inputs
      when: polybot_backups_enabled
      ansible.builtin.copy:
        content: '{{ item.content }}'
        dest: '{{ polybot_root }}/{{ deployment_contract.paths.secrets }}/{{ item.name }}'
        owner: polybot
        group: polybot
        mode: '0600'
      loop:
        - {name: '{{ deployment_contract.transport_files.sftp_key }}', content: '{{ polybot_sftp_private_key }}'}
        - {name: '{{ deployment_contract.transport_files.sftp_known_hosts }}', content: '{{ polybot_sftp_known_hosts }}'}
        - {name: '{{ deployment_contract.transport_files.age_recipients }}', content: '{{ polybot_age_recipients }}'}
      no_log: true
    - name: Install runtime and transport configuration
      ansible.builtin.template:
        src: '{{ item.src }}'
        dest: '{{ polybot_root }}/{{ item.dest }}'
        owner: polybot
        group: polybot
        mode: '0600'
      loop:
        - {src: runtime.env.j2, dest: '{{ deployment_contract.paths.runtime }}'}
        - {src: msmtprc.j2, dest: '{{ deployment_contract.paths.secrets }}/{{ deployment_contract.transport_files.smtp_config }}'}
      no_log: true
    - name: Install backup transport configuration
      ansible.builtin.template:
        src: rclone.conf.j2
        dest: '{{ polybot_root }}/{{ deployment_contract.paths.secrets }}/{{ deployment_contract.transport_files.rclone_config }}'
        owner: polybot
        group: polybot
        mode: '0600'
      when: polybot_backups_enabled
      no_log: true
    - name: Install host operational configuration
      ansible.builtin.copy:
        content: '{{ {"backups_enabled": polybot_backups_enabled, "remote": (deployment_contract.backup_remote + ":" + polybot_sftp_directory) if polybot_backups_enabled else none, "alert_to": polybot_alert_to, "origin": polybot_origin, "http_port": polybot_http_port | int} | to_nice_json }}'
        dest: '{{ polybot_root }}/{{ deployment_contract.paths.operations }}'
        owner: polybot
        group: polybot
        mode: '0600'
    - name: Start host services
      ansible.builtin.systemd_service:
        name: '{{ item }}'
        state: started
        enabled: true
      loop: [docker, tailscaled, ssh]
    - name: Configure the external tailnet
      tags: [tailnet]
      block:
      - name: Inspect Tailscale enrollment
        ansible.builtin.command: tailscale status --json
        register: tailscale_status
        changed_when: false
      - name: Validate enrollment state before changing the tailnet
        ansible.builtin.command:
          argv: [uv, run, --locked, python, -m, scripts.deployment.controller, enrollment]
          stdin: '{{ tailscale_status.stdout }}'
        delegate_to: localhost
        become: false
        changed_when: false
        register: tailnet_enrollment
      - name: Enroll host once without enabling Tailscale SSH
        ansible.builtin.command:
          argv: [tailscale, up, '--auth-key={{ polybot_tailscale_authkey }}', '--advertise-tags={{ deployment_contract.host_tag }}', '--ssh=false']
        when: not (tailnet_enrollment.stdout | from_json).running
        no_log: true
      - name: Read enrolled tailnet identity
        ansible.builtin.command: tailscale status --json
        register: enrolled_tailnet
        changed_when: false
      - name: Validate enrolled identity at the controller boundary
        ansible.builtin.command:
          argv: [uv, run, --locked, python, -m, scripts.deployment.controller, tailnet]
          stdin: '{{ {"status": enrolled_tailnet.stdout | from_json, "origin": polybot_origin} | to_json }}'
        delegate_to: localhost
        become: false
        changed_when: false
      - name: Inspect persistent Serve configuration
        ansible.builtin.command: tailscale serve status --json
        register: serve_status
        changed_when: false
      - name: Validate persisted private Serve configuration
        ansible.builtin.command:
          argv: [uv, run, --locked, python, -m, scripts.deployment.controller, serve]
          stdin: '{{ {"status": serve_status.stdout | from_json, "origin": polybot_origin, "http_port": polybot_http_port | int} | to_json }}'
        delegate_to: localhost
        become: false
        changed_when: false
        register: private_serve
      - name: Configure persistent private HTTPS
        ansible.builtin.command:
          argv: [tailscale, serve, --bg, '--https={{ deployment_contract.https_port }}', 'http://127.0.0.1:{{ polybot_http_port }}']
        when: not (private_serve.stdout | from_json).configured
    - name: Enable monitoring and backup schedules
      ansible.builtin.systemd_service:
        name: '{{ item }}'
        enabled: true
        state: started
        daemon_reload: '{{ unit_installation_result.changed }}'
      loop: '{{ deployment_contract.timers }}'
      when: polybot_backups_enabled or item not in deployment_contract.backup_timers
