[project]
name = "polymarket-bots"

[agents]
max_threads = 48
max_depth = 1

[agents.async_blocking_io_reviewer]
description = "Use only when explicitly invoked by the code-style-review skill. Reports blocking I/O introduced on asynchronous paths."
config_file = "./agents/reviewers/async-blocking-io-reviewer.toml"

